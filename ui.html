<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closet Door</title>
<style>
  :root { --paper:#f4f1ea; --ink:#1d1b18; --mute:#6f6a60; --rule:#cfc8ba; --mark:#9a3b2b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 Georgia, "Times New Roman", serif; }
  header { padding:22px 32px 14px; border-bottom:1px solid var(--ink); display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  h1 { font-size:28px; margin:0; letter-spacing:.01em; }
  header p { margin:0; color:var(--mute); }
  .num { font-family:ui-monospace, Consolas, monospace; font-size:13px; }
  main { display:grid; grid-template-columns:200px 1fr 320px; grid-template-rows:auto 1fr; gap:0; height:calc(100vh - 66px); }
  aside, section { padding:14px 20px; }
  aside { grid-row:1 / 3; border-right:1px solid var(--rule); overflow:auto; }
  .door { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .door img { width:100%; aspect-ratio:3/4; object-fit:cover; cursor:pointer; border:2px solid transparent; filter:grayscale(.15); }
  .door img.on { border-color:var(--mark); filter:none; }
  label { display:block; margin:0 0 12px; color:var(--mute); }
  input[type=range] { width:100%; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--mute); font-weight:normal; margin:0 0 10px; border-bottom:1px solid var(--rule); padding-bottom:4px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .pair img { width:100%; height:300px; object-fit:contain; background:#fff; border:1px solid var(--rule); }
  .cut { background-image:linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%),linear-gradient(45deg,#eee 25%,transparent 25%,transparent 75%,#eee 75%); background-size:16px 16px; background-position:0 0,8px 8px; }
  .readout { border-left:1px solid var(--rule); }
  table { width:100%; border-collapse:collapse; margin-bottom:18px; }
  td { padding:5px 0; border-bottom:1px dotted var(--rule); vertical-align:top; }
  td:last-child { text-align:right; }
  .swatch { display:inline-block; width:14px; height:14px; vertical-align:-2px; margin-right:6px; border:1px solid var(--ink); }
  .bar { height:6px; background:var(--ink); margin-top:3px; }
  .row { display:flex; gap:10px; align-items:flex-start; margin-bottom:14px; }
  .row img { width:72px; height:72px; object-fit:contain; background:#fff; border:1px solid var(--rule); }
  .why { color:var(--mute); font-size:13px; }
  .lower { grid-column:2 / 4; border-top:1px solid var(--rule); display:grid; grid-template-columns:1fr 1.4fr; gap:28px; }
  @media (max-height:760px) { .pair img { height:250px; } .row { margin-bottom:8px; } .row img { width:62px; height:62px; } h2 { margin-bottom:6px; } }
  .busy { opacity:.45; }
</style>
</head>
<body>
<header>
  <h1>Closet Door</h1>
  <p>Hang it on the door. The closet reads it on the device: cut out, type, colour, outfits.</p>
  <p class="num" id="meta"></p>
</header>
<main>
  <aside>
    <label>Today <span class="num" id="tv">22°C</span><input type="range" id="temp" min="5" max="35" value="22"></label>
    <h2>On the door</h2>
    <div class="door" id="door"></div>
  </aside>
  <section id="center">
    <h2>Camera frame / on-device cutout</h2>
    <div class="pair"><img id="orig" alt=""><img id="cut" class="cut" alt=""></div>
  </section>
  <section class="readout">
    <h2>Read on device</h2>
    <table id="facts"></table>
    <h2>Time per stage (ms, desktop CPU, int8)</h2>
    <table id="times"></table>
  </section>
  <section class="lower">
    <div><h2>Looks like what you already own</h2><div id="similar"></div></div>
    <div><h2>Outfits with it today</h2><div id="outfits"></div></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let current = null, cutSrc = '';
async function load() {
  const names = await (await fetch('/door')).json();
  $('#door').innerHTML = names.map(n => `<img loading="lazy" src="/door/${n}" data-n="${n}" alt="${n}">`).join('');
  $('#door').onclick = e => { if (e.target.dataset.n) pick(e.target.dataset.n); };
  if (names.length) pick(names[1] || names[0]);
}
async function pick(n) {
  current = n;
  document.querySelectorAll('.door img').forEach(i => i.classList.toggle('on', i.dataset.n === n));
  $('#orig').src = '/door/' + n;
  document.body.classList.add('busy');
  const fd = new FormData(); fd.append('name', n); fd.append('temp', $('#temp').value);
  const r = await (await fetch('/analyze', { method: 'POST', body: fd })).json();
  document.body.classList.remove('busy');
  cutSrc = r.cutout; $('#cut').src = r.cutout;
  $('#meta').textContent = `closet: ${r.closet_size} items, indexed on this machine · served from 127.0.0.1`;
  $('#facts').innerHTML = `
    <tr><td>Type</td><td>${r.garment}</td></tr>
    <tr><td>Slot</td><td>${r.part}</td></tr>
    <tr><td>Confidence</td><td class="num">${r.confidence.toFixed(2)}</td></tr>
    <tr><td>Main colour</td><td><span class="swatch" style="background:${r.color.hex}"></span>${r.color.name}</td></tr>`;
  const t = r.timings_ms, total = Object.values(t).reduce((a, b) => a + b, 0), max = Math.max(...Object.values(t));
  $('#times').innerHTML = Object.entries(t).map(([k, v]) =>
    `<tr><td>${k}<div class="bar" style="width:${Math.max(2, v / max * 100)}%"></div></td><td class="num">${v}</td></tr>`).join('')
    + `<tr><td><b>total</b></td><td class="num"><b>${total}</b></td></tr>`;
  const img = id => id === 'new' ? cutSrc : '/item/' + id;
  $('#similar').innerHTML = r.similar.map(s =>
    `<div class="row"><img src="${img(s.id)}" alt=""><div>${s.color} ${s.garment}<div class="why num">similarity ${s.sim.toFixed(2)}</div></div></div>`).join('');
  $('#outfits').innerHTML = r.outfits.map(o =>
    `<div class="row">${o.items.map(id => `<img src="${img(id)}" alt="">`).join('')}<div class="why">${o.reasons.join('<br>')}</div></div>`).join('');
}
$('#temp').oninput = e => { $('#tv').textContent = e.target.value + '°C'; };
$('#temp').onchange = () => current && pick(current);
load();
</script>
</body>
</html>
